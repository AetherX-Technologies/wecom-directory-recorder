name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e ./video_extraction
      - run: python -m unittest discover -s . -p "test_*.py"
      - run: python -m pytest video_extraction/tests -q
      - run: python video_extraction/examples/offline_demo.py --output-dir outputs/offline-demo
